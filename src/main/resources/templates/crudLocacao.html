<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CRUD Locação</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
</head>
<body>
<header>
    <nav class="blue darken-2">
        <div class="nav-wrapper container">
            <a href="#" class="brand-logo">Locações</a>
            <ul class="right hide-on-med-and-down">
                <li><a th:href="@{/}">Menu</a></li>
            </ul>
        </div>
    </nav>
</header>

<main class="container section">
    <a class="btn-flat blue-text text-darken-2" th:href="@{/}">
        <i class="material-icons left">arrow_back</i>Voltar
    </a>
    <h4>CRUD de Locação</h4>

    <!-- Formulário de inserção -->
    <div class="card">
        <div class="card-content">
            <span class="card-title">Nova locação</span>
            <form th:action="@{/locacoes/add}" method="post" th:object="${novaLocacao}">
                <div class="row">
                    <div class="input-field col s12 m6">
                        <select th:field="*{clienteCpf}">
                            <option th:each="cli : ${clientes}" th:value="${cli.cpf}" th:text="${cli.nome}"></option>
                        </select>
                        <label>Cliente</label>
                    </div>
                    <div class="input-field col s12 m6">
                        <select th:field="*{carroPlaca}">
                            <option th:each="car : ${carros}" th:value="${car.placa}" th:text="${car.modelo}"></option>
                        </select>
                        <label>Carro</label>
                    </div>
                </div>
                <div class="row">
                    <div class="input-field col s12 m4">
                        <input type="date" th:field="*{dataRetirada}" required>
                        <label>Data Retirada</label>
                    </div>
                    <div class="input-field col s12 m4">
                        <input type="number" th:field="*{diasAlugado}" required>
                        <label>Dias Alugado</label>
                    </div>
                    <div class="input-field col s12 m4">
                        <input type="date" th:field="*{dataDevolucao}" required>
                        <label>Data Devolução</label>
                    </div>
                </div>
                <div class="row">
                    <div class="input-field col s12 m6">
                        <input type="text" th:field="*{tanque}" required>
                        <label>Tanque</label>
                    </div>
                    <div class="input-field col s12 m6">
                        <input type="number" step="0.01" th:field="*{valorTotal}" required>
                        <label>Valor Total</label>
                    </div>
                </div>
                <div class="right-align">
                    <button class="waves-effect waves-light btn" type="submit">
                        <i class="material-icons left">add</i>Inserir
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Tabela de locações -->
    <h5>Lista de locações</h5>
    <table class="striped highlight responsive-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Cliente</th>
            <th>Carro</th>
            <th>Data Retirada</th>
            <th>Dias</th>
            <th>Data Devolução</th>
            <th>Tanque</th>
            <th>Valor Total</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="l : ${locacoes}">
            <td colspan="9">
                <form th:action="@{/locacoes/update}" method="post" class="row">
                    <input type="hidden" name="id" th:value="${l.id}">
                    <div class="col s1"><span th:text="${l.id}"></span></div>
                    <div class="col s2"><input type="text" name="clienteCpf" th:value="${l.clienteCpf}"></div>
                    <div class="col s2"><input type="text" name="carroPlaca" th:value="${l.carroPlaca}"></div>
                    <div class="col s2"><input type="date" name="dataRetirada" th:value="${l.dataRetirada}"></div>
                    <div class="col s1"><input type="number" name="diasAlugado" th:value="${l.diasAlugado}"></div>
                    <div class="col s2"><input type="date" name="dataDevolucao" th:value="${l.dataDevolucao}"></div>
                    <div class="col s1"><input type="text" name="tanque" th:value="${l.tanque}"></div>
                    <div class="col s2"><input type="number" step="0.01" name="valorTotal" th:value="${l.valorTotal}"></div>
                    <div class="col s1">
                        <button class="waves-effect waves-light btn-small" type="submit">
                            <i class="material-icons">edit</i>
                        </button>
                    </div>
                </form>
                <form th:action="@{/locacoes/delete}" method="post" style="display:inline;">
                    <input type="hidden" name="id" th:value="${l.id}">
                    <button class="waves-effect waves-light btn-small red" type="submit">
                        <i class="material-icons">delete</i>
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>

<footer class="page-footer blue darken-2">
    <div class="container">
        <div class="row">
            <div class="col s12">
                <span class="white-text">&copy; <span th:text="${#dates.format(#dates.createNow(),'yyyy')}"></span> Aluguel de Carros</span>
            </div>
        </div>
    </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const elems = document.querySelectorAll('select');
        M.FormSelect.init(elems);
    });
</script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
