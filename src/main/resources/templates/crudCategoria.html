<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Categoria</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header>
    <nav class="blue darken-2">
        <div class="nav-wrapper container">
            <a href="#" class="brand-logo">Categorias</a>
            <ul class="right hide-on-med-and-down">
                <li><a th:href="@{/}">Menu</a></li>
            </ul>
        </div>
    </nav>
</header>

<main class="container section">
    <a id="voltar" class="btn-flat blue-text text-darken-2" th:href="@{/}">
        <i class="material-icons left">arrow_back</i>Voltar
    </a>
    <h4>CRUD de Categoria</h4>

    <!-- Formulário de inserção -->
    <div class="card">
        <div class="card-content">
            <span class="card-title">Inserir nova categoria</span>
            <form th:action="@{/categoria/add}" method="post" th:object="${novaCategoria}">
                <div class="row">
                    <div class="input-field col s12 m6">
                        <input id="nome" type="text" th:field="*{nome}" class="validate" required>
                        <label for="nome">Nome</label>
                        <span class="helper-text red-text" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
                    </div>
                    <div class="input-field col s12 m6">
                        <input id="valorDiaria" type="number" step="0.01" min="0" th:field="*{valorDiaria}" class="validate" required>
                        <label for="valorDiaria">Valor da diária</label>
                        <span class="helper-text red-text" th:if="${#fields.hasErrors('valorDiaria')}" th:errors="*{valorDiaria}"></span>
                    </div>
                </div>
                <div class="right-align">
                    <button class="waves-effect waves-light btn" type="submit">
                        <i class="material-icons left">add</i>Inserir
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Tabela de categorias -->
    <h5>Lista de categorias</h5>
<table class="striped highlight responsive-table">
    <thead>
    <tr>
        <th>Nome</th>
        <th>Valor da diária</th>
        <th>Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="cat : ${categorias}">
        <form th:action="@{/categoria/update}" method="post">
            <!-- ID oculto para manter a referência -->
            <input type="hidden" name="id" th:value="${cat.id}">

            <!-- Campo editável para nome -->
            <td>
                <input type="text" name="nome" th:value="${cat.nome}">
            </td>

            <!-- Campo editável para valor da diária -->
            <td>
                <input type="number" step="0.01" name="valorDiaria" th:value="${cat.valorDiaria}">
            </td>

            <!-- Botões de ação -->
            <td>
                <!-- Editar -->
                <button class="waves-effect waves-light btn-small" type="submit">
                    <i class="material-icons">edit</i>
                </button>

                <!-- Remover -->
                <form th:action="@{/categoria/delete}" method="post" style="display:inline;">
                    <input type="hidden" name="id" th:value="${cat.id}">
                    <button class="waves-effect waves-light btn-small red" type="submit">
                        <i class="material-icons">delete</i>
                    </button>
                </form>
            </td>
        </form>
    </tr>
    </tbody>
</table>

</main>

<footer class="page-footer blue darken-2">
    <div class="container">
        <div class="row">
            <div class="col s12">
                <span class="white-text">&copy; <span th:text="${#dates.format(#dates.createNow(),'yyyy')}"></span> Aluguel de Carros</span>
            </div>
        </div>
    </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
