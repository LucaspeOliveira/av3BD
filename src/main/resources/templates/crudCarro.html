<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Carro</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header>
    <nav class="blue darken-2">
        <div class="nav-wrapper container">
            <a href="#" class="brand-logo">Carros</a>
            <ul class="right hide-on-med-and-down">
                <li><a th:href="@{/}">Menu</a></li>
            </ul>
        </div>
    </nav>
</header>

<main class="container section">
    <a class="btn-flat blue-text text-darken-2" th:href="@{/}">
        <i class="material-icons left">arrow_back</i>Voltar
    </a>
    <h4>CRUD de Carro</h4>

    <!-- Formulário de inserção -->
    <div class="card">
        <div class="card-content">
            <span class="card-title">Inserir novo carro</span>
            <form th:action="@{/carros/add}" method="post" th:object="${novoCarro}">
                <div class="row">
                    <div class="input-field col s12 m3">
                        <input id="placa" type="text" th:field="*{placa}" required>
                        <label for="placa">Placa</label>
                    </div>
                    <div class="input-field col s12 m3">
                        <input id="modelo" type="text" th:field="*{modelo}" required>
                        <label for="modelo">Modelo</label>
                    </div>
                    <div class="input-field col s12 m3">
                        <input id="marca" type="text" th:field="*{marca}" required>
                        <label for="marca">Marca</label>
                    </div>
                    <div class="input-field col s12 m3">
                        <input id="cor" type="text" th:field="*{cor}" required>
                        <label for="cor">Cor</label>
                    </div>
                </div>

                <div class="row">
                    <div class="input-field col s12 m3">
                        <input id="kmRodados" type="number" step="0.1" th:field="*{kmRodados}" required>
                        <label for="kmRodados">Km rodados</label>
                    </div>
                    <div class="input-field col s12 m3">
                        <input id="ano" type="number" min="1900" max="2100" th:field="*{ano}" required>
                        <label for="ano">Ano</label>
                    </div>
                    <div class="input-field col s12 m3">
                        <input id="combustivel" type="text" th:field="*{combustivel}" required>
                        <label for="combustivel">Combustível</label>
                    </div>
                    <div class="input-field col s12 m3">
                        <input id="cambio" type="text" th:field="*{cambio}" required>
                        <label for="cambio">Câmbio</label>
                    </div>
                </div>

                <div class="row">
                    <div class="input-field col s12 m6">
                        <select th:field="*{categoriaId}">
                            <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nome}"></option>
                        </select>
                        <label>Categoria</label>
                    </div>
                    <div class="input-field col s12 m6">
                        <input id="status" type="text" th:field="*{status}" required>
                        <label for="status">Status</label>
                    </div>
                </div>

                <div class="right-align">
                    <button class="waves-effect waves-light btn" type="submit">
                        <i class="material-icons left">add</i>Inserir
                    </button>
                </div>
            </form>
        </div>
    </div>
	<div class="right-align" style="margin-bottom: 20px;">
    	<a class="waves-effect waves-light btn blue" th:href="@{/carros/all}">
        <i class="material-icons left">list</i>Listar Todos
    	</a>
    	<a class="waves-effect waves-light btn green" th:href="@{/carros/disponiveis}">
        <i class="material-icons left">check_circle</i>Listar Disponíveis
    	</a>
	</div>
	
    <!-- Tabela de carros -->
    <h5>Lista de carros</h5>
    <table class="striped highlight responsive-table">
        <thead>
        <tr>
            <th>Placa</th>
            <th>Modelo</th>
            <th>Marca</th>
            <th>Cor</th>
            <th>Km</th>
            <th>Ano</th>
            <th>Combustível</th>
            <th>Câmbio</th>
            <th>Status</th>
            <th>Categoria</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="carro : ${carros}">
            <!-- Form de update (edição inline) -->
            <form th:action="@{/carros/update}" method="post">
                <!-- Placa identificador -->
                <td>
                    <input type="hidden" name="placa" th:value="${carro.placa}">
                    <span th:text="${carro.placa}"></span>
                </td>

                <!-- Campos editáveis -->
                <td><input type="text" name="modelo" th:value="${carro.modelo}"></td>
                <td><input type="text" name="marca" th:value="${carro.marca}"></td>
                <td><input type="text" name="cor" th:value="${carro.cor}"></td>
                <td><input type="number" step="0.1" name="kmRodados" th:value="${carro.kmRodados}"></td>
                <td><input type="number" min="1900" max="2100" name="ano" th:value="${carro.ano}"></td>
                <td><input type="text" name="combustivel" th:value="${carro.combustivel}"></td>
                <td><input type="text" name="cambio" th:value="${carro.cambio}"></td>
                <td><input type="text" name="status" th:value="${carro.status}"></td>

                <!-- Categoria (texto + id hidden; pode virar select se quiser editar) -->
                <td>
                    <input type="hidden" name="categoriaId" th:value="${carro.categoriaId}">
                    <span th:text="${carro.categoriaNome}"></span>
                </td>

                <!-- Ações -->
                <td>
                    <button class="waves-effect waves-light btn-small" type="submit">
                        <i class="material-icons">edit</i>
                    </button>
                </td>
            </form>

            <!-- Form de delete (separado, sem aninhar) -->
            <td style="display:none;"></td> <!-- placeholder só para manter colunas alinhadas -->
            <td>
                <form th:action="@{/carros/delete}" method="post" style="display:inline;">
                    <input type="hidden" name="placa" th:value="${carro.placa}">
                    <button class="waves-effect waves-light btn-small red" type="submit">
                        <i class="material-icons">delete</i>
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>

<footer class="page-footer blue darken-2">
    <div class="container">
        <div class="row">
            <div class="col s12">
                <span class="white-text">&copy; <span th:text="${#dates.format(#dates.createNow(),'yyyy')}"></span> Aluguel de Carros</span>
            </div>
        </div>
    </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const elems = document.querySelectorAll('select');
        M.FormSelect.init(elems);
    });
</script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
