<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Histórico de Locações</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link rel="stylesheet" href="../static/css/style.css" th:href="@{/css/style.css}">
</head>
<body>
<header>
    <nav class="blue darken-2">
        <div class="nav-wrapper container">
            <a href="#" class="brand-logo">Histórico</a>
            <ul class="right hide-on-med-and-down">
                <li><a th:href="@{/}">Menu</a></li>
            </ul>
        </div>
    </nav>
</header>

<main class="container section">
    <a class="btn-flat blue-text text-darken-2" th:href="@{/}">
        <i class="material-icons left">arrow_back</i>Voltar
    </a>
    <h4>Histórico de Locações</h4>

    
    <h5>Lista de locações encerradas</h5>
    <table class="striped highlight responsive-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Cliente</th>
            <th>Locação</th>
            <th>Data da Locação</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="h : ${historicos}">
            <td><input type="text" th:value="${h.id}" readonly class="table-input"></td>
            <td><input type="text" th:value="${h.clienteCpf}" readonly class="table-input"></td>
            <td><input type="text" th:value="${h.locacaoId}" readonly class="table-input"></td>
            <td><input type="text" th:value="${h.dataLocacao}" readonly class="table-input"></td>
        </tr>
        </tbody>
    </table>
</main>

<footer class="page-footer blue darken-2">
    <div class="container">
        <div class="row">
            <div class="col s12">
                <span class="white-text">&copy; 
                    <span th:text="${#dates.format(#dates.createNow(),'yyyy')}"></span> 
                    Aluguel de Carros
                </span>
            </div>
        </div>
    </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
<script src="../static/js/main.js" th:src="@{/js/main.js}"></script>
</body>
</html>
