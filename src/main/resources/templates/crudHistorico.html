<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <nav class="blue darken-2"><div class="nav-wrapper container"><a href="#" class="brand-logo">Histórico</a><ul class="right hide-on-med-and-down"><li><a th:href="@{/}">Menu</a></li></ul></div></nav>
    </header>

    <main class="container section">
        <a id="voltar" class="btn-flat blue-text text-darken-2" th:href="@{/}"><i class="material-icons left">arrow_back</i>Voltar</a>
        <h4>Histórico do Cliente</h4>

        <div class="row">
            <div class="input-field col s12 m8"><input id="pesquisa" type="text" placeholder="CPF"><label for="pesquisa" class="active">Pesquisar por CPF</label></div>
            <div class="col s12 m4">
                <button id="Inserir" class="waves-effect waves-light btn"><i class="material-icons left">search</i>Pesquisar</button>
            </div>
        </div>

        <table class="striped highlight responsive-table">
            <thead>
                <tr><th>CPF do cliente</th></tr>
            </thead>
            <tbody id="histCliente"></tbody>
        </table>
    </main>

    <footer class="page-footer blue darken-2"><div class="container"><div class="row"><div class="col s12 white-text">&copy; <span th:text="${#dates.format(#dates.createNow(),'yyyy')}"></span> Aluguel de Carros</div></div></div></footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
