<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Clientes</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <!-- Original when using Thymeleaf: <link rel="stylesheet" th:href="@{/css/style.css}"> -->
    <link rel="stylesheet" href="../static/css/style.css" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <nav class="blue darken-2">
            <div class="nav-wrapper container">
                <a href="#" class="brand-logo">Clientes</a>
                <ul class="right hide-on-med-and-down">
                    <li><a th:href="@{/}">Menu</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="container section">
        <a id="voltar" class="btn-flat blue-text text-darken-2" th:href="@{/}"><i class="material-icons left">arrow_back</i>Voltar</a>
        <h4>CRUD de Clientes</h4>

        <div class="card">
            <div class="card-content">
                <div class="row">
                    <div class="input-field col s12 m4"><input id="cpf" type="number" placeholder="CPF"><label for="cpf" class="active">CPF</label></div>
                    <div class="input-field col s12 m4"><input id="nome" type="text" placeholder="Nome"><label for="nome" class="active">Nome</label></div>
                    <div class="input-field col s12 m4"><input id="numhabilitacao" type="number" placeholder="NumHabilitação"><label for="numhabilitacao" class="active">Num Habilitação</label></div>
                    <div class="input-field col s12 m6"><input id="endereco" type="text" placeholder="Endereço"><label for="endereco" class="active">Endereço</label></div>
                    <div class="input-field col s12 m3"><input id="numendereco" type="number" placeholder="Num do endereço"><label for="numendereco" class="active">Número</label></div>
                    <div class="input-field col s12 m3"><input id="cep" type="number" placeholder="Cep"><label for="cep" class="active">CEP</label></div>
                    <div class="input-field col s12 m4"><input id="estado" type="text" placeholder="Estado"><label for="estado" class="active">Estado</label></div>
                </div>
                <div class="right-align">
                    <button id="Inserir" class="waves-effect waves-light btn"><i class="material-icons left">add</i>Inserir</button>
                </div>
            </div>
        </div>
        <h5>Lista de clientes</h5>
        <table class="striped highlight responsive-table">
            <thead>
                <tr>
                    <th>CPF</th>
                    <th>Nome</th>
                    <th>NumHabilitação</th>
                    <th>Endereço</th>
                    <th>Num do endereço</th>
                    <th>Cep</th>
                    <th>Estado</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
            <tr th:each="cli : ${clientes}">
                
                <form th:action="@{/clientes/update}" method="post">
                    <td>
                        <input type="hidden" name="cpf" th:value="${cli.cpf}">
                        <input type="text" th:value="${cli.cpf}" readonly class="table-input">
                    </td>
                    <td><input type="text" name="nome" th:value="${cli.nome}"></td>
                    <td><input type="text" name="numeroHabilitacao" th:value="${cli.numeroHabilitacao}"></td>
                    <td><input type="text" name="endereco" th:value="${cli.endereco}"></td>
                    <td><input type="number" name="numero" th:value="${cli.numero}"></td>
                    <td><input type="text" name="cep" th:value="${cli.cep}"></td>
                    <td><input type="text" name="estado" th:value="${cli.estado}"></td>

                    
                    <td>
                        <button class="waves-effect waves-light btn-small" type="submit">
                            <i class="material-icons">edit</i>
                        </button>
                    </td>
                </form>

                <td style="display:none;"></td>

                
                <td>
                    <form th:action="@{/clientes/delete}" method="post" style="display:inline;">
                        <input type="hidden" name="cpf" th:value="${cli.cpf}">
                        <button class="waves-effect waves-light btn-small red" type="submit">
                            <i class="material-icons">delete</i>
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </main>

    <footer class="page-footer blue darken-2"><div class="container"><div class="row"><div class="col s12 white-text">&copy; <span th:text="${#dates.format(#dates.createNow(),'yyyy')}"></span> Aluguel de Carros</div></div></div></footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <!-- Original when using Thymeleaf: <script th:src="@{/js/main.js}"></script> -->
    <script src="../static/js/main.js" th:src="@{/js/main.js}"></script>
</body>
</html>
