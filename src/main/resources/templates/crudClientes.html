<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Clientes</title>
    <link rel="stylesheet" href="stlye.css">
</head>
<body>
    <button id="voltar" class="btn-voltar">↩</button>
    <h1>Crud de Clientes</h1>

    <div class="form">
        <input type="number" id="cpf" placeholder="CPF">
        <input type="text" id="nome" placeholder="Nome">
        <input type="number" id="numhabilitação" placeholder="NumHabilitação">
        <input type="text" id="endereço" placeholder="Endereço">
        <input type="number" id="numendereço" placeholder="Num do endereço">
        <input type="number" id="cep" placeholder="Cep">
        <input type="text" id="estado" placeholder="Estado">
    </div>
    <div class="acao">
        <button id="Inserir">Inserir</button>
        <button id="editar">Editar</button>
        <button id="adicionar">Adicionar</button>
        <button id="remover">Remover</button>
    </div>
    <table>
        <thead>
            <tr>
                <th>CPF</th>
                <th>Nome</th>
                <th>NumHabilitação</th>
                <th>Endereço</th>
                <th>Num do endereço</th>
                <th>Cep</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody id="crud-clientes">
        </tbody>
    </table>
</body>
</html>
