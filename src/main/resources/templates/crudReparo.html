<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Reparos</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <nav class="blue darken-2"><div class="nav-wrapper container"><a href="#" class="brand-logo">Reparos</a><ul class="right hide-on-med-and-down"><li><a th:href="@{/}">Menu</a></li></ul></div></nav>
    </header>

    <main class="container section">
        <a id="voltar" class="btn-flat blue-text text-darken-2" th:href="@{/}"><i class="material-icons left">arrow_back</i>Voltar</a>
        <h4>CRUD de Reparos</h4>

        <div class="card"><div class="card-content">
            <div class="row">
                <div class="input-field col s12 m3"><input id="placa" type="number"><label for="placa" class="active">Placa</label></div>
                <div class="input-field col s12 m3"><input id="diaEntrada" type="text"><label for="diaEntrada" class="active">Dia da Entrada</label></div>
                <div class="input-field col s12 m3"><input id="qntsDias" type="number"><label for="qntsDias" class="active">Quantos dias</label></div>
                <div class="input-field col s12 m3"><input id="valor" type="text"><label for="valor" class="active">Valor</label></div>
                <div class="input-field col s12"><textarea id="comentario" class="materialize-textarea"></textarea><label for="comentario" class="active">Comentário</label></div>
            </div>
            <div class="right-align">
                <button id="Inserir" class="waves-effect waves-light btn"><i class="material-icons left">add</i>Inserir</button>
                <button id="editar" class="waves-effect waves-light btn">Editar</button>
                <button id="adicionar" class="waves-effect waves-light btn">Adicionar</button>
                <button id="remover" class="waves-effect waves-light btn red">Remover</button>
            </div>
        </div></div>

        <table class="striped highlight responsive-table">
            <thead>
                <tr>
                    <th>Placa</th>
                    <th>Dia da Entrada</th>
                    <th>Quantos dias</th>
                    <th>Valor</th>
                </tr>
            </thead>
            <tbody id="crud-reparos"></tbody>
        </table>
    </main>

    <footer class="page-footer blue darken-2"><div class="container"><div class="row"><div class="col s12 white-text">&copy; <span th:text="${#dates.format(#dates.createNow(),'yyyy')}"></span> Aluguel de Carros</div></div></div></footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
