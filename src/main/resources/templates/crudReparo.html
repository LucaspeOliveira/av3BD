<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CRUD Reparo</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link rel="stylesheet" href="../static/css/style.css" th:href="@{/css/style.css}">
</head>
<body>
<header>
    <nav class="blue darken-2">
        <div class="nav-wrapper container">
            <a href="#" class="brand-logo">Reparos</a>
            <ul class="right hide-on-med-and-down">
                <li><a th:href="@{/}">Menu</a></li>
            </ul>
        </div>
    </nav>
</header>

<main class="container section">
    <a class="btn-flat blue-text text-darken-2" th:href="@{/}">
        <i class="material-icons left">arrow_back</i>Voltar
    </a>
    <h4>CRUD de Reparo</h4>

    
    <div class="card">
        <div class="card-content">
            <span class="card-title">Novo reparo</span>
            <form th:action="@{/reparos/add}" method="post" th:object="${novoReparo}">
                <div class="row">
                    <div class="input-field col s12 m6">
                        <select th:field="*{carroPlaca}">
                            <option th:each="car : ${carros}" th:value="${car.placa}" th:text="${car.modelo}"></option>
                        </select>
                        <label>Carro</label>
                    </div>
                    <div class="input-field col s12 m6">
                        <input type="date" th:field="*{dataEntrada}" required>
                        <label>Data Entrada</label>
                    </div>
                </div>
                <div class="row">
                    <div class="input-field col s12 m4">
                        <input type="number" th:field="*{diasReparo}" required>
                        <label>Dias Reparo</label>
                    </div>
                    <div class="input-field col s12 m4">
                        <input type="text" th:field="*{descricao}" required>
                        <label>Descrição</label>
                    </div>
                    <div class="input-field col s12 m4">
                        <input type="number" step="0.01" th:field="*{valorReparo}" required>
                        <label>Valor Reparo</label>
                    </div>
                </div>
                <div class="row">
                    <div class="input-field col s12 m6">
                        <input type="date" th:field="*{dataConclusao}" required>
                        <label>Data Conclusão</label>
                    </div>
                </div>
                <div class="right-align">
                    <button class="waves-effect waves-light btn" type="submit">
                        <i class="material-icons left">add</i>Inserir
                    </button>
                </div>
            </form>
        </div>
    </div>

    
    <h5>Lista de reparos</h5>
    <table class="striped highlight responsive-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Carro</th>
            <th>Data Entrada</th>
            <th>Dias</th>
            <th>Descrição</th>
            <th>Valor</th>
            <th>Data Conclusão</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${reparos}">
            <form th:action="@{/reparos/update}" method="post">
                <td>
                    <input type="hidden" name="id" th:value="${r.id}">
                    <input type="text" th:value="${r.id}" readonly class="table-input">
                </td>
                <td><input type="text" name="carroPlaca" th:value="${r.carroPlaca}"></td>
                <td><input type="date" name="dataEntrada" th:value="${r.dataEntrada}"></td>
                <td><input type="number" name="diasReparo" th:value="${r.diasReparo}"></td>
                <td><input type="text" name="descricao" th:value="${r.descricao}"></td>
                <td><input type="number" step="0.01" name="valorReparo" th:value="${r.valorReparo}"></td>
                <td><input type="date" name="dataConclusao" th:value="${r.dataConclusao}"></td>
                <td>
                    <button class="waves-effect waves-light btn-small" type="submit">
                        <i class="material-icons">edit</i>
                    </button>
                </td>
            </form>
            <td>
                <form th:action="@{/reparos/delete}" method="post" style="display:inline;">
                    <input type="hidden" name="id" th:value="${r.id}">
                    <button class="waves-effect waves-light btn-small red" type="submit">
                        <i class="material-icons">delete</i>
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>

<footer class="page-footer blue darken-2">
    <div class="container">
        <div class="row">
            <div class="col s12">
                <span class="white-text">&copy; 
                    <span th:text="${#dates.format(#dates.createNow(),'yyyy')}"></span> 
                    Aluguel de Carros
                </span>
            </div>
        </div>
    </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
<!-- Original when using Thymeleaf: <script th:src="@{/js/main.js}"></script> -->
<script src="../static/js/main.js" th:src="@{/js/main.js}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const elems = document.querySelectorAll('select');
        M.FormSelect.init(elems);
    });
</script>
</body>
</html>
