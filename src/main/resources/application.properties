spring.application.name=av3LabBD
server.port=2469
#Conexao com o BD
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=db_av3;encrypt=true;trustServerCertificate=true
spring.datasource.username=teste
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true
## Desabilitar operações DDL automáticas em ambientes com permissões limitadas
# Não permitir que o Hibernate tente alterar/atualizar o esquema no startup
spring.jpa.hibernate.ddl-auto=none

# Evita que o Hibernate faça algumas leituras de metadata JDBC que requerem permissões
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.proc.param_null_passing = true

# Nota: se preferir que o app atualize o schema automaticamente, configure o usuário do
# banco com permissões apropriadas (ou use um profile específico para dev).